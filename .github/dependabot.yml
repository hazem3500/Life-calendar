version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that change the UI or APIs need their own migration, not a bump:
      # Chakra 3 is a rewrite, next-plausible 4 needs a new script setup,
      # TypeScript 7 and ESLint 10 wait for the Next tooling to support them.
      - dependency-name: '@chakra-ui/*'
        update-types: [version-update:semver-major]
      - dependency-name: next-plausible
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Types follow the Node version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
